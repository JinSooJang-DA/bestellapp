<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell-App</title>
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="header-content">
        <div class="header-nav">
            <img src="./assets/icons/logo2.svg" alt="Logo" class="header-logo">
            <img src="./assets/icons/menu.svg" alt="Menu" class="header-menu-icon">
        </div>
    </header>
    <div class="landing-img">
        <img src="./assets/img/hero.png" alt="" class="hero-img">
        <div class="restaurant-badge">
            <img src="./assets/img/burger-2d.png" alt="Burger Icon">
        </div>
    </div>
    <div class="restaurant-info">
        <h2>Burgerhouse</h2>
        <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
    </div>
    
    <div class="category-header">
        <div class="category-inner">
            <img src="./assets/img/chanese1.png" alt="" class="chanese-logo">
            <h3>Burger & Sandwiches</h3>
        </div>
    </div>

    <div class="content-wrapper">
        <section class="content">
            <div class="menu-content">
            </div>
        </section>

        <section class="basket-wrapper">
            <div class="basket">
                <h2>Shopping Cart Section</h2>
            </div>
        </section>
    </div>

    <footer>
        <h2>footer</h2>
    </footer>
    <script src="./script.js"></script>
</body>

</html>
